  const n = d.normalize(), a = (L1 * L1 - L2 * L2 + L * L) / (2 * L), h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));

  up.quaternion.copy(pq.clone().invert().multiply(q1)); up.updateWorldMatrix(true, true);

// pose: {x,z,yaw,crouch,lean,mood,hands:{l,r}(world), hints, headYaw, hide}
function pose(p, c) {
  p.root.visible = !c.hide; if (c.hide) return;
  p.root.position.set(c.x, 0, c.z); p.root.rotation.y = c.yaw || 0;
  const a = (c.crouch || 0) * 1.45, hipY = .49 + .45 * Math.cos(a) + (c.bob || 0);
  p.hips.position.y = hipY; p.spine.rotation.x = c.lean || 0; p.head.rotation.set(c.headX || 0, c.headYaw || 0, c.headRoll || 0);
  p.legs.forEach((l, i) => { l.th.rotation.x = -a; l.sh.rotation.x = a * 1.0; l.th.rotation.z = i ? -.04 : .04; });
  const smile = c.mood !== 'worry'; p.smile.visible = smile; p.frown.visible = !smile;
  p.brows.forEach((b, i) => { b.rotation.z = (c.mood === 'worry' ? 1 : 0) * (i ? -.35 : .35); b.position.y = .05 + (c.mood === 'worry' ? .006 : 0); });
  p.root.updateMatrixWorld(true);
  p.arms.forEach(arm => {
    const key = arm.s < 0 ? 'l' : 'r'; let T = c.hands && c.hands[key];
    const sh = arm.up.getWorldPosition(new THREE.Vector3());
    if (!T) T = p.root.localToWorld(V(arm.s * .27, .78 + (c.bob || 0) + (hipY - .94) * 0.0, .03)).setY(sh.y - .56);
    const hint = (c.hints && c.hints[key]) || p.root.localToWorld(V(arm.s * 1, -.2, -.6)).sub(p.root.position);

const headWorld = (p, dx = 0, dy = 0, dz = 0) => { p.head.updateWorldMatrix(true, false); return p.head.localToWorld(V(dx, dy, dz)); };

// ---------------- planos ----------------
const hide = { hide: true };
function setDevice(pos, rotY, rotX = 0) { dev.position.copy(pos); dev.rotation.set(rotX, rotY, 0); }
function cam(p, t, fov = 42) { camera.fov = fov; camera.position.copy(p); camera.lookAt(t); camera.updateProjectionMatrix(); fill.position.copy(p).add(V(1.5, 2.5, 0)); fill.target.position.copy(t); }
const mixV = (a, b, k) => a.clone().lerp(b, k);
let curShot = '';

const SHOTS = {
  hook1(u, d) { // pneu vazio, casal preocupado
    const k = smooth(u / d); setFlat(1); dev.visible = false; nozzle.visible = false; if (hoseMesh) hoseMesh.visible = false;
    const sw = Math.sin(u * 5) * .01;
    pose(man, { x: -2.85, z: 1.7, yaw: .7, mood: 'worry', crouch: 0, bob: sw, hands: { l: null, r: null }, headYaw: -.5 });
    pose(man, { x: -2.85, z: 1.7, yaw: .7, mood: 'worry', bob: sw, headYaw: -.45,
      hands: { l: headWorld(man, -.16, .04, .0), r: headWorld(man, .16, .04, 0) }, hints: { l: V(-1, .3, -.4), r: V(1, .3, -.4) } });
    pose(woman, { x: -1.55, z: 2.5, yaw: .35, mood: 'worry', headYaw: -.5,
      hands: { l: headWorld(woman, -.12, -.06, .09), r: null }, hints: { l: V(-.3, -1, .6) } });
    cam(mixV(V(-2.0, 1.45, 8.2), V(-2.2, 1.15, 6.3), k), mixV(V(-2.2, .95, 1.4), V(-2.2, .85, 1.4), k), 44);
  },
  inflate(u, d, s0 = 1, s1 = 0, mode = 'a') { // homem agachado a encher
    const k = smooth(u / d), s = lerp(s0, s1, smooth((u - .5) / Math.max(.1, d - 1.0))); setFlat(s); const v = valveWorld();
    dev.visible = true; nozzle.visible = true;
    dev.scale.setScalar(2.4); const dp = V(-1.5, .12, 2.05); setDevice(dp, .15); dev.updateMatrixWorld(true);
    const top = dev.localToWorld(V(-.03, .1, 0)); setHose(top, v, .06);

    const done = u > d * .72;
    pose(woman, { x: .5, z: 2.7, yaw: -.6, mood: 'smile', bob: w * .1, headYaw: .35,
      hands: { r: done ? headWorld(woman, .34, .18, .05) : null, l: null }, hints: { r: V(1, .2, .1) } });
    if (mode === 'a') cam(mixV(V(-.2, .85, 4.1), V(.5, 1.2, 6.3), k), mixV(V(-1.9, .55, 1.3), V(-1.4, .8, 1.5), k), 40);
    else cam(mixV(V(-.3, .55, 3.7), V(-.9, .6, 3.1), k), V(-1.9, .45, 1.2), 38);
  },
  hero(u, d) { // homem mostra o inflador
    dev.scale.setScalar(1.9); const k = smooth(u / d); setFlat(1); dev.visible = true; nozzle.visible = false; if (hoseMesh) hoseMesh.visible = false;
    const yaw = .25 + .1 * Math.sin(u * 1.5);
    pose(man, { x: -2.9, z: 2.2, yaw, mood: 'smile', headYaw: .0, hands: null });
    const hp = man.root.localToWorld(V(.2, 1.12, .42 + .03 * Math.sin(u * 2)));
    pose(man, { x: -2.9, z: 2.2, yaw, mood: 'smile', headYaw: -.05, hands: { r: hp, l: man.root.localToWorld(V(-.3, .95, .1)) }, hints: { r: V(.6, -1, -.2), l: V(-.8, -.3, -.5) } });
    setDevice(hp.clone().add(V(0, .1, .05)), 0, -.08);
    pose(woman, hide);
    cam(mixV(V(-4.3, 1.3, 4.6), V(-3.5, 1.3, 4.1), k), V(-2.55, 1.28, 2.4), 38);
  },
};
function stage(shot, u, d) {
  window.warnTri.visible = shot === 'hook1';
  if (shot === 'hook1') SHOTS.hook1(u, d);
  else if (shot === 'hook2') SHOTS.inflate(u, d, 1, .55, 'b');
  else if (shot === 'inflate') SHOTS.inflate(u, d, 1, 0, 'a');
  else if (shot === 'hero') { SHOTS.hero(u, d); dev.lookAt(camera.position); }
  renderer.render(scene, camera);
}
window.renderShot = (shot, u, d, q = 0.93) => { stage(shot, u, d); return renderer.domElement.toDataURL('image/jpeg', q); };
window.dbg = () => ({ dev: dev.position.toArray(), vis: dev.visible, scale: dev.scale.toArray(), cam: camera.position.toArray() });
window.ready = true;
